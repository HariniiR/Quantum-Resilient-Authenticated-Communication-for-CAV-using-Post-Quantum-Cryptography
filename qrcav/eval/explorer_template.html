<style>
/* Layout: a module rail on the left (the order data travels through the system),
   one module page at a time on the right; the rail becomes a scrolling strip on phones.
   Same visual language as results/viewer.html: road-signage type, asphalt neutrals,
   state colours borrowed from traffic signals. */
:root {
  --bg: #eef0ec; --panel: #f8f9f6; --ink: #1b211f; --ink2: #56605b; --ink3: #8b948f;
  --line: #d3d8d1; --road: #dde1da; --block: #e7eae4;
  --accent: #0f7a63;   /* session up, accepted, verified */
  --amber: #c27100;    /* in progress, certificates */
  --red: #c0392b;      /* rejected, faulty, crashed */
  --violet: #6d4bd1;   /* alerts, signatures */
  --blue: #2a6db0;     /* key exchange, proposals */
  --display: "Barlow Semi Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111513; --panel: #171c1a; --ink: #e6ebe7; --ink2: #9aa59f; --ink3: #6d7672;
    --line: #2c3430; --road: #262d2a; --block: #1a201d;
    --accent: #2fbf98; --amber: #f0a330; --red: #ef6a5b; --violet: #a48bf2; --blue: #6ba6e8; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111513; --panel: #171c1a; --ink: #e6ebe7; --ink2: #9aa59f; --ink3: #6d7672;
  --line: #2c3430; --road: #262d2a; --block: #1a201d;
  --accent: #2fbf98; --amber: #f0a330; --red: #ef6a5b; --violet: #a48bf2; --blue: #6ba6e8; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--body); font-size: 15.5px; line-height: 1.5; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; letter-spacing: 0.005em; line-height: 1.12; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(30px, 4.2vw, 46px); }
h2 { font-size: clamp(26px, 3vw, 34px); }
h3 { font-size: 19px; font-weight: 600; }
p { margin: 0; }
code, .mono { font-family: var(--mono); font-size: 0.86em; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: 100vh; }
.rail { position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: 100vh; overflow-y: auto;
  border-right: 1px solid var(--line); background: var(--panel); padding-block: 22px 28px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: 14px;
  display: grid; align-content: start; gap: 18px; }
.brand { display: grid; gap: 4px; }
.brand .tag { font-family: var(--mono); font-size: 12px; color: var(--ink2); }
.brand b { font-family: var(--display); font-size: 21px; font-weight: 700; line-height: 1.1; }
.navgroup { display: grid; gap: 2px; }
.navgroup > span { font-family: var(--display); font-weight: 600; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink3); padding: 0 8px 4px; }
.nav { display: grid; grid-template-columns: 26px 1fr; align-items: baseline; gap: 4px; padding: 6px 8px; border-radius: 5px; border: 0; background: transparent; text-align: left; cursor: pointer; color: var(--ink2); }
.nav .n { font-family: var(--mono); font-size: 12px; color: var(--ink3); }
.nav .t { font-family: var(--display); font-weight: 600; font-size: 16px; }
.nav:hover { background: var(--block); color: var(--ink); }
.nav[aria-current="page"] { background: var(--ink); color: var(--panel); }
.nav[aria-current="page"] .n { color: var(--panel); opacity: 0.7; }
.railnote { font-size: 12.5px; color: var(--ink3); line-height: 1.45; }

main { min-width: 0; padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.page { max-width: 1120px; margin: 0 auto; display: grid; gap: 22px; }
.phead { display: grid; gap: 10px; }
.eyebrow { font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink2); }
.lead { font-size: 17px; color: var(--ink2); max-width: 70ch; }
.lead b { color: var(--ink); font-weight: 600; }
.files { display: flex; flex-wrap: wrap; gap: 6px; }
.file { font-family: var(--mono); font-size: 12px; padding: 3px 8px; border: 1px solid var(--line); border-radius: 4px; color: var(--ink2); background: var(--panel); }
.run { font-family: var(--mono); font-size: 12.5px; color: var(--ink2); }
.run b { color: var(--ink); font-weight: 500; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 16px 18px; display: grid; gap: 12px; min-width: 0; }
.label { font-family: var(--display); font-weight: 600; font-size: 12.5px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink2); }
.cols { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.cols.even { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
@media (max-width: 1000px) { .cols, .cols.even { grid-template-columns: minmax(0, 1fr); } }
.note { font-size: 13.5px; color: var(--ink2); max-width: 78ch; }
.plain { border-left: 3px solid var(--accent); padding: 2px 0 2px 12px; font-size: 15px; max-width: 75ch; }
.plain b { font-weight: 600; }
ul.notice { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 14.5px; max-width: 75ch; }

.btn { font: 600 14.5px var(--display); letter-spacing: 0.02em; padding: 7px 14px; border-radius: 5px; border: 1px solid var(--ink); background: var(--ink); color: var(--panel); cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--ink2); }
.btn:disabled { opacity: 0.4; cursor: default; }
.ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.ctl select { font: 14px var(--body); padding: 6px 8px; border-radius: 5px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
.clock { font-family: var(--mono); font-size: 13.5px; font-variant-numeric: tabular-nums; color: var(--ink2); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; flex-wrap: wrap; }
.seg button { font: 600 14px var(--display); padding: 7px 12px; background: transparent; color: var(--ink2); border: 0; border-left: 1px solid var(--line); cursor: pointer; }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
input[type=range] { width: 100%; accent-color: var(--accent); }

.pill { display: inline-block; font: 600 12px var(--display); letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 7px; border-radius: 3px; white-space: nowrap; }
.pill.ok { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
.pill.bad { background: color-mix(in srgb, var(--red) 16%, transparent); color: var(--red); }
.pill.warn { background: color-mix(in srgb, var(--amber) 18%, transparent); color: var(--amber); }
.pill.info { background: color-mix(in srgb, var(--blue) 15%, transparent); color: var(--blue); }
.pill.vio { background: color-mix(in srgb, var(--violet) 15%, transparent); color: var(--violet); }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); overflow: hidden; }
.stat { padding: 14px 16px; border-left: 1px solid var(--line); display: grid; gap: 2px; align-content: start; }
.stat:first-child { border-left: 0; }
.stat b { font-family: var(--mono); font-weight: 500; font-size: 22px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--ink2); }
@media (max-width: 640px) { .stat { border-left: 0; border-top: 1px solid var(--line); } .stat:first-child { border-top: 0; } }

.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th { font-family: var(--display); font-weight: 600; font-size: 12.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink2); text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.num, th.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.hl td { background: color-mix(in srgb, var(--accent) 8%, transparent); }

.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 5px 14px; font-size: 14px; }
.kv > span:nth-child(odd) { color: var(--ink2); }
.kv > span:nth-child(even) { font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; }
@media (max-width: 640px) { .kv { grid-template-columns: minmax(0, 1fr); gap: 1px; } .kv > span:nth-child(odd) { margin-top: 6px; font-size: 12.5px; } }
.hex { font-family: var(--mono); font-size: 12.5px; overflow-wrap: anywhere; color: var(--ink2); }

svg text { font-family: var(--body); }
.diagram { width: 100%; height: auto; display: block; }
.dwrap { overflow-x: auto; }
.dwrap svg { min-width: 620px; }
.click { cursor: pointer; }
.click:hover .hit, .click:focus-visible .hit { stroke: var(--accent); stroke-width: 2.5; }
.click:focus { outline: none; }

.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; counter-reset: s; }
.steps li { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 4px 12px; padding: 12px 4px; border-top: 1px solid var(--line); align-items: baseline; }
.steps li:first-child { border-top: 0; }
.steps .k { font-family: var(--mono); font-size: 13px; color: var(--ink3); }
.steps .w b { font-family: var(--display); font-weight: 600; font-size: 17px; }
.steps .w p { font-size: 14.5px; color: var(--ink2); }
.steps .fig { font-family: var(--mono); font-size: 13px; text-align: right; }
.steps .go { grid-column: 2 / -1; justify-self: start; font: 600 13.5px var(--display); background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; }

.bytebar { display: flex; height: 28px; border-radius: 4px; overflow: hidden; border: 1px solid var(--line); }
.bytebar > div { min-width: 2px; display: flex; align-items: center; justify-content: center; font: 500 11.5px var(--mono); color: #fff; white-space: nowrap; overflow: hidden; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--ink2); }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.frames { display: flex; flex-wrap: wrap; gap: 4px; }
.frames span { width: 18px; height: 12px; border-radius: 2px; background: var(--amber); }
.frames.small span { background: var(--accent); }

.feed { font-family: var(--mono); font-size: 12.5px; display: grid; gap: 1px; max-height: 300px; overflow-y: auto; border-top: 1px solid var(--line); padding-top: 6px; }
.feed button { all: unset; display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 8px; padding: 3px 4px; border-radius: 3px; cursor: pointer; color: var(--ink2); }
.feed button:hover { background: var(--block); }
.feed button.now { background: var(--block); color: var(--ink); }
.feed .tt { color: var(--ink3); text-align: right; font-variant-numeric: tabular-nums; }
.feed .ok { color: var(--accent); } .feed .bad { color: var(--red); } .feed .vio { color: var(--violet); } .feed .warn { color: var(--amber); } .feed .info { color: var(--blue); }
.chapters { display: flex; flex-wrap: wrap; gap: 6px; }
.chapters button { font: 600 13.5px var(--display); padding: 5px 10px; border-radius: 4px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
.chapters button:hover { border-color: var(--ink2); }
.caption { min-height: 46px; font-size: 15px; border-left: 3px solid var(--violet); padding: 4px 0 4px 12px; }
.caption b { font-weight: 600; }

.window { display: grid; grid-template-columns: repeat(32, 1fr); gap: 2px; }
.window span { aspect-ratio: 1; border-radius: 2px; background: var(--block); border: 1px solid var(--line); }
.window span.on { background: var(--accent); border-color: var(--accent); }
.window span.top { outline: 2px solid var(--ink); outline-offset: 0; }
.log { font-family: var(--mono); font-size: 12.5px; display: grid; gap: 2px; max-height: 190px; overflow-y: auto; }
.log .ok { color: var(--accent); } .log .bad { color: var(--red); } .log div { color: var(--ink2); }

.chain { display: flex; gap: 0; overflow-x: auto; padding-bottom: 8px; align-items: stretch; }
.blk { flex: none; width: 168px; border: 1px solid var(--line); border-radius: 6px; padding: 10px 11px; background: var(--panel); display: grid; gap: 3px; cursor: pointer; text-align: left; font-size: 12.5px; }
.blk b { font-family: var(--display); font-size: 17px; font-weight: 700; }
.blk .h { font-family: var(--mono); font-size: 11.5px; color: var(--ink2); }
.blk[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.blk.broken { border-color: var(--red); box-shadow: inset 0 0 0 1px var(--red); }
.link { flex: none; width: 26px; align-self: center; height: 2px; background: var(--ink3); position: relative; }
.link.broken { background: var(--red); }
.link.broken::after { content: "✕"; position: absolute; left: 7px; top: -10px; color: var(--red); font-size: 13px; font-weight: 700; }

.scoreRow { display: grid; grid-template-columns: 74px minmax(0, 1fr) 46px 40px; gap: 8px; align-items: center; font-size: 13px; }
.scoreRow .bar { height: 10px; background: var(--block); border-radius: 2px; overflow: hidden; }
.scoreRow .bar i { display: block; height: 100%; background: var(--ink2); }
.scoreRow .bar i.cn { background: var(--accent); }
.scoreRow .bar i.bz { background: var(--red); }
.scoreRow .v { font-family: var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
.scoreRow .d { font-family: var(--mono); font-size: 12px; }

.chart { width: 100%; height: auto; display: block; max-width: 780px; }
.chartbox { display: grid; gap: 8px; }
canvas.map { width: 100%; aspect-ratio: 1 / 1; display: block; max-width: 100%; }
canvas.air { width: 100%; height: 70px; display: block; }
.empty { padding: 30px; text-align: center; color: var(--ink2); border: 1px dashed var(--line); border-radius: 7px; }

@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; height: auto; border-right: 0; border-bottom: 1px solid var(--line);
    padding-block: 10px; padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px));
    grid-auto-flow: column; grid-auto-columns: max-content; overflow-x: auto; overflow-y: hidden; gap: 12px; align-items: center; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
  .brand, .railnote, .navgroup > span { display: none; }
  .navgroup { grid-auto-flow: column; }
  .nav { grid-template-columns: auto auto; white-space: nowrap; }

@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
</style>

<div class="app">
  <nav class="rail" aria-label="Modules">

      barChart({ cats: suites, series: [{ color: "var(--accent)", values: suites.map(s2 => (bb.find(r => r.suite === s2 && r.mode.startsWith("AEAD")) || {}).total_p99_ms || 0) }, { color: "var(--violet)", values: suites.map(s2 => (bb.find(r => r.suite === s2 && r.mode.startsWith("signed")) || {}).total_p99_ms || 0) }],
        yLabel: "ms, crypto + airtime, p99", valueFmt: v => nf(v, 1), yMax: 16 }),
      legend([["var(--accent)", "AES-GCM record inside a session (135 B)"], ["var(--violet)", "individually signed broadcast"]]),
      h("p", { class: "note", text: "Vehicles send 10 beacons a second, so each must be ready within 100 ms. Inside a session a beacon costs under 0.5 ms whatever the suite; signing every beacon with ML-DSA is possible but up to 30 times slower and bigger." })),
    panel("Safety and liveness with faulty validators",
      barChart({ cats: ft.map(r => String(r.byzantine)), series: [{ color: "var(--accent)", values: ft.map(r => r.commit_pct) }], yLabel: "% of requests committed", yMax: 100, valueFmt: v => nf(v, 0),
        refLine: null }),
      h("p", { class: "note", html: `Voting set of ${ft[0] ? ft[0].consensus_set : 7} (f = ${ft[0] ? ft[0].f : 2}). With up to f faulty nodes every request commits. With more, progress stops, but <b>nothing wrong is ever committed</b> (safety held in all ${ft.length} runs). x-axis: number of faulty nodes.` }))));
  sec.appendChild(h("div", { class: "cols even" },
    panel("Recovery after the leader crashes",
      barChart({ cats: tos.map(x => x + " s"), series: ["ags", "pbft"].map((m, j) => ({ color: j ? "var(--red)" : "var(--accent)", values: tos.map(x => ((vc.find(r => r.mode === m && r.vc_timeout_s === x) || {}).recovery_first_commit_ms || 0) / 1000) })),
        yLabel: "s until first commit after crash", valueFmt: v => nf(v, 1) }),
      legend([["var(--accent)", "AGS-PBFT"], ["var(--red)", "PBFT"]]),
      h("p", { class: "note", text: "x-axis: view-change timeout. Recovery is dominated by the timeout (it doubles on each failed view); both protocols recover the same way." })),
    panel("Score dynamics: a faulty node is pushed out",
      scoreChart(R.score_dynamics),
      h("p", { class: "note", text: "Scores of every validator over successive blocks in the evaluation run. The wrong-result node loses 5 per block and drops below μ − σ at the next regroup; a silent node stops gaining, so it falls behind the honest nodes." }))));
  sec.appendChild(panel("Where to find the rest",
    notice(["Figures fig1–fig11: <code>results/*.png</code> (also in the report, chapter 6).",
      "Report tables: <code>report/generated/*.tex</code>, built by <code>scripts/make_tables.py</code>.",
      "Unit and integration tests: <code>pytest</code> (55 tests, including a real multi-process run)."])));
});
function scoreChart(sd) {
  if (!sd || !Array.isArray(sd.trace) || !sd.trace.length) return h("div", { class: "empty", text: "No score data." });
  const byBlock = new Map();
  for (const r of sd.trace) { if (!byBlock.has(r.block)) byBlock.set(r.block, { mu: r.mu, sigma: r.sigma, s: {} }); byBlock.get(r.block).s[r.node] = r.score; }
  const blocks = [...byBlock.keys()].sort((x, y) => x - y);
  const nodes = [...new Set(sd.trace.map(r => r.node))].sort();
  const step = Math.max(1, Math.ceil(blocks.length / 12));
  const xs = blocks.map((b, i) => i % step === 0 ? b : "");
  const series = nodes.map(n => ({ color: n === sd.wrong ? "var(--red)" : n === sd.silent ? "var(--amber)" : "var(--ink3)", width: n === sd.wrong || n === sd.silent ? 2.4 : 1, values: blocks.map(b => byBlock.get(b).s[n] ?? null) }))
    .sort((x, y) => (x.width - y.width));
  series.push({ color: "var(--blue)", dash: "5 4", width: 1.6, values: blocks.map(b => byBlock.get(b).mu - byBlock.get(b).sigma) });
  const all = series.flatMap(x => x.values).filter(v => v !== null);
  const lo = Math.floor(Math.min(...all) / 10) * 10, hi = Math.max(...all);
  const shifted = series.map(se => ({ ...se, values: se.values.map(v => v === null ? null : v - lo) }));
  const c = lineChart({ xs, series: shifted, xLabel: "block", yLabel: "score", yMax: niceMax(hi - lo), yFmt: v => nf(v + lo) });
  c.querySelectorAll("circle").forEach(x => x.remove());
  return h("div", null, c, legend([["var(--red)", `${sd.wrong} (wrong results)`], ["var(--amber)", `${sd.silent} (silent)`], ["var(--ink3)", "honest nodes"], ["var(--blue)", "μ − σ cut-off"]]));
}
